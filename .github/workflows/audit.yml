name: Dependency audit

on:
  push:
    # main only: without this, a push to a PR branch fires push *and*
    # pull_request, and the event_name in the concurrency key stops them
    # cancelling each other, so the same commit gets audited twice.
    branches: [main]
    paths:
      - requirements.txt
      - requirements-dev.txt
      - .github/workflows/audit.yml
  pull_request:
    paths:
      - requirements.txt
      - requirements-dev.txt
      - .github/workflows/audit.yml
  # Daily, so a new advisory against an unchanged lock is still noticed.
  schedule:
    - cron: '41 16 * * *'
  workflow_dispatch: {}

# Cancel a superseded run (e.g. rapid pushes to a PR), but keep push/schedule
# runs separate since they aren't racing on the same trigger. Keyed on
# github.workflow so it can't collide with build.yml's concurrency group.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

# No token permissions by default; the job declares exactly what it needs.
permissions: {}

jobs:
  audit:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'

      # Audits the locked versions against the PyPI/OSV advisory databases.
      # --disable-pip reads the fully pinned, hashed lock directly instead of
      # installing it. Findings fail the job and show in the log.
      - name: pip-audit
        env:
          PIP_AUDIT_VERSION: 2.10.1
        run: |
          pip install "pip-audit==${PIP_AUDIT_VERSION}"
          pip-audit --disable-pip -r requirements.txt
          pip-audit --no-deps --disable-pip -r requirements-dev.txt
