name: Build and publish image

on:
  push:
    branches: [main]
    paths:
      - dataview/**
      - tests/**
      - Dockerfile
      - .dockerignore
      - gunicorn.conf.py
      - healthcheck.py
      - manage.py
      - pyproject.toml
      - requirements*.txt
      - .github/workflows/build.yml
  pull_request:
  schedule:
    # Daily check for a new upstream base image digest
    - cron: '17 4 * * *'
  workflow_dispatch: {}

permissions:
  contents: read

env:
  # Keep in step with the PYTHON_IMAGE default in the Dockerfile.
  UPSTREAM_IMAGE: python:3.14-slim
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/dataview
  DIGEST_FILE: .cache/upstream-digest

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: |
          pip install --require-hashes -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Test
        run: pytest

  build:
    needs: test
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write
      packages: write
    env:
      PUBLISH: ${{ github.event_name != 'pull_request' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore last-known upstream digest
        uses: actions/cache@v4
        with:
          path: ${{ env.DIGEST_FILE }}
          key: upstream-digest-${{ github.run_id }}
          restore-keys: |
            upstream-digest-

      - name: Get upstream image digest
        id: upstream
        run: |
          digest="$(docker buildx imagetools inspect "$UPSTREAM_IMAGE" --format '{{json .Manifest}}' | sha256sum | cut -d' ' -f1)"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Compare against last-known digest
        id: compare
        run: |
          stored=""
          if [ -f "$DIGEST_FILE" ]; then
            stored="$(cat "$DIGEST_FILE")"
          fi
          if [ "$stored" = "${{ steps.upstream.outputs.digest }}" ] && [ "${{ github.event_name }}" = "schedule" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        if: steps.compare.outputs.changed == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: steps.compare.outputs.changed == 'true' && env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pull requests build the image to prove it still builds, without pushing.
      - name: Build and push
        if: steps.compare.outputs.changed == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          pull: true
          push: ${{ env.PUBLISH == 'true' }}
          build-args: |
            PYTHON_IMAGE=${{ env.UPSTREAM_IMAGE }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          tags: |
            ${{ env.IMAGE_NAME }}:3-slim
            ${{ env.IMAGE_NAME }}:latest

      - name: Record upstream digest for cache
        if: env.PUBLISH == 'true'
        run: |
          mkdir -p "$(dirname "$DIGEST_FILE")"
          echo "${{ steps.upstream.outputs.digest }}" > "$DIGEST_FILE"

      - name: Keep scheduled trigger alive
        if: env.PUBLISH == 'true'
        run: |
          age_days=$(( ($(date +%s) - $(git log -1 --format=%ct)) / 86400 ))
          if [ "$age_days" -gt 45 ]; then
            date -u +%Y-%m-%dT%H:%M:%SZ > .github/keepalive
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add .github/keepalive
            git commit -m "chore: keepalive commit to prevent scheduled workflow disable"
            git push
          fi
